# Multi-chain ROFL Header Oracle configuration
# Each service monitors a different source chain and reports to the same ROFLAdapter

x-oracle-common: &oracle-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ghcr.io/oasisprotocol/rofl-header-oracle:multichain
  platform: linux/amd64
  restart: on-failure
  volumes:
    - /run/rofl-appd.sock:/run/rofl-appd.sock

x-common-env: &common-env
  PYTHONUNBUFFERED: 1
  TARGET_RPC_URL: ${TARGET_RPC_URL}
  ROFL_ADAPTER_ADDRESS: ${ROFL_ADAPTER_ADDRESS}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
  RETRY_COUNT: ${RETRY_COUNT:-3}
  ORACLE_MODE: ${ORACLE_MODE}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JSON_LOGS: ${JSON_LOGS:-false}

services:
  # Base Chain Oracle (Chain ID: 8453)
  oracle-base:
    <<: *oracle-common
    container_name: rofl_oracle_base
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SOURCE_RPC_URL: ${BASE_SOURCE_RPC_URL}
      # Event listener mode only
      SOURCE_CONTRACT_ADDRESS: ${BASE_SOURCE_CONTRACT_ADDRESS:-}
      POLLING_INTERVAL: ${BASE_POLLING_INTERVAL:-2}
      LOOKBACK_BLOCKS: ${BASE_LOOKBACK_BLOCKS:-100}
      # Watcher mode only
      WATCH_ADDRESSES: ${BASE_WATCH_ADDRESSES:-}
      SCAN_INTERVAL: ${BASE_SCAN_INTERVAL:-2}
      WATCHER_BATCH_SIZE: ${BASE_WATCHER_BATCH_SIZE:-50}
      ENABLE_INTERNAL_TX_DETECTION: ${BASE_ENABLE_INTERNAL_TX_DETECTION:-false}
      # Push mode only
      PUSH_INTERVAL: ${BASE_PUSH_INTERVAL:-2}
      PUSH_BATCH_SIZE: ${BASE_PUSH_BATCH_SIZE:-20}
      # Token watcher mode only (also uses SCAN_INTERVAL)
      TOKEN_ADDRESSES: ${BASE_TOKEN_ADDRESSES:-}
      RECIPIENT_ADDRESSES: ${BASE_RECIPIENT_ADDRESSES:-}
      MAX_BLOCKS_PER_SCAN: ${BASE_MAX_BLOCKS_PER_SCAN:-10}

  # Ethereum Oracle (Chain ID: 1)
  oracle-eth:
    <<: *oracle-common
    container_name: rofl_oracle_eth
    ports:
      - "8081:8080"
    environment:
      <<: *common-env
      SOURCE_RPC_URL: ${ETH_SOURCE_RPC_URL}
      # Event listener mode only
      SOURCE_CONTRACT_ADDRESS: ${ETH_SOURCE_CONTRACT_ADDRESS:-}
      POLLING_INTERVAL: ${ETH_POLLING_INTERVAL:-12}
      LOOKBACK_BLOCKS: ${ETH_LOOKBACK_BLOCKS:-100}
      # Watcher mode only
      WATCH_ADDRESSES: ${ETH_WATCH_ADDRESSES:-}
      SCAN_INTERVAL: ${ETH_SCAN_INTERVAL:-12}
      WATCHER_BATCH_SIZE: ${ETH_WATCHER_BATCH_SIZE:-50}
      ENABLE_INTERNAL_TX_DETECTION: ${ETH_ENABLE_INTERNAL_TX_DETECTION:-false}
      # Push mode only
      PUSH_INTERVAL: ${ETH_PUSH_INTERVAL:-12}
      PUSH_BATCH_SIZE: ${ETH_PUSH_BATCH_SIZE:-20}
      # Token watcher mode only (also uses SCAN_INTERVAL)
      TOKEN_ADDRESSES: ${ETH_TOKEN_ADDRESSES:-}
      RECIPIENT_ADDRESSES: ${ETH_RECIPIENT_ADDRESSES:-}
      MAX_BLOCKS_PER_SCAN: ${ETH_MAX_BLOCKS_PER_SCAN:-10}

  # Arbitrum Oracle (Chain ID: 42161)
  oracle-arb:
    <<: *oracle-common
    container_name: rofl_oracle_arb
    ports:
      - "8082:8080"
    environment:
      <<: *common-env
      SOURCE_RPC_URL: ${ARB_SOURCE_RPC_URL}
      # Event listener mode only
      SOURCE_CONTRACT_ADDRESS: ${ARB_SOURCE_CONTRACT_ADDRESS:-}
      POLLING_INTERVAL: ${ARB_POLLING_INTERVAL:-1}
      LOOKBACK_BLOCKS: ${ARB_LOOKBACK_BLOCKS:-100}
      # Watcher mode only
      WATCH_ADDRESSES: ${ARB_WATCH_ADDRESSES:-}
      SCAN_INTERVAL: ${ARB_SCAN_INTERVAL:-1}
      WATCHER_BATCH_SIZE: ${ARB_WATCHER_BATCH_SIZE:-50}
      ENABLE_INTERNAL_TX_DETECTION: ${ARB_ENABLE_INTERNAL_TX_DETECTION:-false}
      # Push mode only
      PUSH_INTERVAL: ${ARB_PUSH_INTERVAL:-1}
      PUSH_BATCH_SIZE: ${ARB_PUSH_BATCH_SIZE:-20}
      # Token watcher mode only (also uses SCAN_INTERVAL)
      TOKEN_ADDRESSES: ${ARB_TOKEN_ADDRESSES:-}
      RECIPIENT_ADDRESSES: ${ARB_RECIPIENT_ADDRESSES:-}
      MAX_BLOCKS_PER_SCAN: ${ARB_MAX_BLOCKS_PER_SCAN:-10}
