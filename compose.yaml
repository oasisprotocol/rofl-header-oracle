services:
  header-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/oasisprotocol/rofl-header-oracle:latest
    platform: linux/amd64
    container_name: rofl_header_oracle
    ports:
      - "8080:8080"  # Health check endpoint
    environment:
      # Python configuration
      PYTHONUNBUFFERED: 1  # Disable output buffering for immediate log visibility

      # Common configuration (all modes)
      SOURCE_RPC_URL: ${SOURCE_RPC_URL}
      TARGET_RPC_URL: ${TARGET_RPC_URL}
      ROFL_ADAPTER_ADDRESS: ${ROFL_ADAPTER_ADDRESS}  # Required - ROFLAdapter contract address
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}  # HTTP request timeout in seconds
      RETRY_COUNT: ${RETRY_COUNT}  # Number of retry attempts

      # Oracle mode: event_listener, push, watcher, or token_watcher
      ORACLE_MODE: ${ORACLE_MODE:-event_listener}

      # Logging configuration
      LOG_LEVEL: ${LOG_LEVEL}  # DEBUG, INFO, WARNING, ERROR, CRITICAL
      JSON_LOGS: ${JSON_LOGS}  # Enable JSON-formatted structured logging

      # Event Listener Mode Configuration (ORACLE_MODE=event_listener)
      SOURCE_CONTRACT_ADDRESS: ${SOURCE_CONTRACT_ADDRESS}  # Required for event_listener mode
      POLLING_INTERVAL: ${POLLING_INTERVAL}  # Seconds between event checks
      LOOKBACK_BLOCKS: ${LOOKBACK_BLOCKS}  # Blocks to look back on startup

      # Push Mode Configuration (ORACLE_MODE=push)
      PUSH_INTERVAL: ${PUSH_INTERVAL}  # Seconds between block pushes
      PUSH_BATCH_SIZE: ${PUSH_BATCH_SIZE}  # Max blocks to push per iteration

      # Watcher Mode Configuration (ORACLE_MODE=watcher)
      WATCH_ADDRESSES: ${WATCH_ADDRESSES:-}  # Required for watcher mode - comma-separated addresses
      SCAN_INTERVAL: ${SCAN_INTERVAL}  # Seconds between scanning for interactions
      WATCHER_BATCH_SIZE: ${WATCHER_BATCH_SIZE}  # Max blocks to scan per iteration
      ENABLE_INTERNAL_TX_DETECTION: ${ENABLE_INTERNAL_TX_DETECTION:-false}  # Requires archive node with debug API

      # Token Watcher Mode Configuration (ORACLE_MODE=token_watcher)
      TOKEN_ADDRESSES: ${TOKEN_ADDRESSES:-}  # Required for token_watcher mode - comma-separated token contract addresses
      RECIPIENT_ADDRESSES: ${RECIPIENT_ADDRESSES:-}  # Required for token_watcher mode - comma-separated recipient addresses

    restart: on-failure
    volumes:
      - /run/rofl-appd.sock:/run/rofl-appd.sock
