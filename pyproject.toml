[project]
name = "rofl-oracle"
version = "0.1.0"
description = "ROFL Oracle for blockchain bridge operations"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "web3",
    "eth-typing",
    "httpx",
    "cbor2>=5.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "python-dotenv>=1.1.1",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 80
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",      # pycodestyle errors
    "E7",
    "E9",
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "ICN",     # flake8-import-conventions
    "PIE",     # flake8-pie
    "PYI",     # flake8-pyi
    "RSE",     # flake8-raise
    "RUF",     # Ruff-specific rules
    "SIM",     # flake8-simplify
    "T20",     # flake8-print
]

ignore = [
    "E501",    # line too long, handled by formatter
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "T201",    # print statements allowed (used in tests and CLI output)
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"

